# Parallel development processes.
#
#   bun run dev            # everything
#   bunx mprocs api        # start one process by name
#
# `procs` is a map of name -> process. Each entry needs exactly one of `shell`
# or `cmd`. `<CONFIG_DIR>` expands to the directory holding this file, so the
# paths stay correct no matter which directory mprocs was launched from.
#
# Each process runs in its app directory (`cwd`), so the frontends pick up their
# own `.env` from there and the API/scripts load the root `.env` themselves via
# `--env-file=../../.env`; no env is forwarded from here.

procs:
  api:
    cwd: <CONFIG_DIR>/apps/api
    shell: bun run dev
    autorestart: true

  admin:
    cwd: <CONFIG_DIR>/apps/admin
    shell: bun run dev
    autorestart: true

  riders:
    cwd: <CONFIG_DIR>/apps/riders
    shell: bun run dev
    autorestart: true

  web:
    cwd: <CONFIG_DIR>/apps/web
    shell: bun run dev
    autorestart: true
